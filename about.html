<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <script>(function(){var t=+localStorage.getItem('gd-t')||0;if(t===1)document.documentElement.setAttribute('data-theme','dark');})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Griff Drury</title>
<link rel="stylesheet" href="css/main.css">
<style>
body { overflow-x: hidden; }
.about-page { min-height: 100vh; padding: 100px 28px 60px; max-width: 800px; margin: 0 auto; }
.about-page-title { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: clamp(40px,6vw,72px); letter-spacing: -0.03em; text-transform: uppercase; color: var(--ink); line-height: 0.92; margin-bottom: 40px; transition: color 0.4s; }
.about-page-title .or { color: var(--orange); }
.placeholder { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 0.08em; line-height: 1.9; color: var(--muted); padding: 24px; border: 0.5px dashed var(--border); border-radius: 2px; }

/* ── cursor: force none on every element in this page ── */
html, body, *, *::before, *::after { cursor: none !important; }

/* ── custom cursor ── */
#cur {
  position: fixed; width: 8px; height: 8px; background: #fff;
  border-radius: 50%; pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%); mix-blend-mode: difference;
  transition: transform .12s cubic-bezier(.34,1.56,.64,1);
}

/* dial inline */
#dial-float{position:fixed;top:0;left:50%;transform:translate(-50%,4px);width:80px;height:80px;z-index:9998;pointer-events:none;overflow:visible;}
#arc-svg{position:absolute;top:0;left:0;width:80px;height:80px;overflow:visible;pointer-events:none;z-index:2;}
#nd-arc{fill:none;stroke-linecap:round;stroke-width:1.4;stroke:rgba(14,13,12,.28);}
[data-theme="dark"] #nd-arc{stroke:rgba(240,235,227,.28);}
#nd-knob{position:absolute;width:48px;height:48px;top:16px;left:16px;border-radius:50%;background:#0E0D0C;border:.5px solid rgba(14,13,12,.09);transition:background .4s,border-color .4s,transform .44s cubic-bezier(.34,1.08,.64,1);z-index:1;pointer-events:all;}
[data-theme="dark"] #nd-knob{background:#3A3632;border-color:rgba(255,255,255,.07);}
#nd-indicator{position:absolute;width:4.4px;height:4.4px;border-radius:50%;background:#F0EBE3;top:5px;left:50%;margin-left:-2.2px;}
/* icon + label: absolutely positioned INSIDE dial-float, flanking the dial at nav text height */
.nd-icon{position:absolute;right:calc(100% + 8px);top:10px;font-size:13px;line-height:1;color:#E85D00;pointer-events:all;white-space:nowrap;user-select:none;-webkit-user-select:none;}
.nd-label{position:absolute;left:calc(100% + 8px);top:11px;font-family:'DM Mono','Courier New',monospace;font-size:10px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:#E85D00;pointer-events:all;white-space:nowrap;user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
<div id="cur"></div>

<div id="dial-float">
  <span class="nd-icon" id="nd-icon" onclick="advTheme()">&#x2600;</span>
  <svg id="arc-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <path id="nd-arc" d="M 15.43,22.79 A 30,30,0,0,1,40,10 A 30,30,0,0,1,64.57,22.79"/>
    <circle class="nd-pm" id="nd-pm0" cx="15.43" cy="22.79" r="3" fill="rgba(14,13,12,.55)" onclick="setTheme(0);event.stopPropagation();" style="pointer-events:all;"/>
    <circle class="nd-pm" id="nd-pm1" cx="40" cy="10" r="3" fill="rgba(14,13,12,.55)" onclick="setTheme(1);event.stopPropagation();" style="pointer-events:all;"/>
    <circle class="nd-pm" id="nd-pm2" cx="64.57" cy="22.79" r="3" fill="rgba(14,13,12,.55)" onclick="setTheme(2);event.stopPropagation();" style="pointer-events:all;"/>
  </svg>
  <div id="nd-knob" onclick="advTheme()">
    <div id="nd-indicator"></div>
  </div>
  <span class="nd-label" id="nd-label" onclick="advTheme()">Light</span>
</div>
<nav class="top-nav">
  <div class="nav-mark" onclick="window.location.href='index.html'">
    <span class="nav-g">G.</span><span class="nav-drury">Drury</span>
  </div>
  <div class="nav-center"></div>
  <div class="nav-right">
        <button id="btn-menu" onclick="menuToggle()">menu</button>
      </div>
</nav>
<div class="about-page">
  <h1 class="about-page-title">About<br><span class="or">Griff</span></h1>
  <div class="placeholder">About page — coming soon. This page will contain Griff's biography, design philosophy, CV, and process writing.</div>
</div>
<script>
/* ── cursor ── */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
document.addEventListener('mousedown', () => { cur.style.transform = 'translate(-50%,-50%) scale(0.5)'; });
document.addEventListener('mouseup',   () => { cur.style.transform = 'translate(-50%,-50%) scale(1)'; });
/* ── theme dial ── */
(function(){
  var MODES=['Light','Dark','Fun'];
  var ICONS=['\u2600','\u263d','\u2605'];
  var INC=[55,55,250];
  var DOT_R=3, DOT_R_ACTIVE=4;
  var st=0, ang=-55;

  var saved=+localStorage.getItem('gd-t')||0;
  if(saved===1){st=1;ang=0;document.documentElement.setAttribute('data-theme','dark');}
  else if(saved===2){st=2;ang=55;}

  function dotColor(active){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    if(active) return '#E85D00';
    return dark?'rgba(240,235,227,.55)':'rgba(14,13,12,.55)';
  }

  function rotateKnob(dur){
    var k=document.getElementById('nd-knob');
    if(!k) return;
    if(dur){k.style.transition='transform '+dur+'s cubic-bezier(0.34,1.08,0.64,1)';}
    else{k.style.transition='none';}
    k.style.transform='rotate('+ang+'deg)';
  }

  function renderUI(){
    for(var j=0;j<3;j++){
      var pm=document.getElementById('nd-pm'+j);
      if(!pm) continue;
      pm.style.fill=dotColor(j===st);
      pm.setAttribute('r',j===st?DOT_R_ACTIVE:DOT_R);
    }
    var ic=document.getElementById('nd-icon');
    var lb=document.getElementById('nd-label');
    if(ic) ic.textContent=ICONS[st];
    if(lb) lb.textContent=MODES[st];
  }

  function applyTheme(){
    if(st===1) document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('gd-t',st);
    renderUI();
  }

  window.advTheme=function(){
    var prev=st;ang+=INC[prev];st=(st+1)%3;
    rotateKnob(INC[prev]===250?0.9:0.44);
    applyTheme();
  };

  window.setTheme=function(target){
    if(target===st) return;
    var deg=0,tmp=st,n=0;
    while(tmp!==target&&n<3){deg+=INC[tmp];tmp=(tmp+1)%3;n++;}
    ang+=deg;st=target;
    rotateKnob(Math.max(0.44,deg/280*0.9));
    applyTheme();
  };

  rotateKnob(0);
  renderUI();
})();

/* cursor hover: orange on interactive elements */
function setHover(on){
  var c=document.getElementById('cur');
  if(!c) return;
  c.style.background=on?'#E85D00':'#fff';
  c.style.mixBlendMode=on?'normal':'difference';
  c.style.width=c.style.height=on?'9px':'8px';
}
document.querySelectorAll('#btn-menu,.nd-icon,.nd-label,.nd-pm,#nd-knob').forEach(function(el){
  el.addEventListener('mouseenter',function(){setHover(true);});
  el.addEventListener('mouseleave',function(){setHover(false);});
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/nav-system.js"></script>
</body>
</html>
