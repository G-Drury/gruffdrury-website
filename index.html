<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gruff Drury — Designer & Maker</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=dm-mono@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --fg: #f0ede6;
    --accent: #e87c3e;
    --muted: #555;
    --border: #222;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Satoshi', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 2rem;
  }

  .card {
    width: 100%;
    max-width: 540px;
    border: 1px solid var(--border);
    padding: 3rem 3rem 2.5rem;
    position: relative;
  }

  /* corner ticks */
  .card::before, .card::after,
  .card .tl, .card .tr {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    border-color: var(--accent);
    border-style: solid;
  }
  .card .tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .card .tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
  .card::before { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    margin-bottom: 2rem;
    opacity: 0.9;
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
    color: var(--fg);
  }

  h1 span {
    color: var(--accent);
  }

  p {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #aaa;
    margin-bottom: 0.75rem;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 2rem 0;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .meta-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .contact-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
    transition: border-color 0.2s, color 0.2s;
  }

  .contact-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  @media (max-width: 480px) {
    .card { padding: 2rem 1.75rem 1.75rem; }
  }
</style>
</head>
<body>
<div class="card">
  <span class="tl"></span><span class="tr"></span>

  <div class="tag">Under Construction</div>

  <h1>Site coming <span>soon.</span></h1>

  <p>This site is currently being rebuilt. Back shortly.</p>
  <p>In the meantime, feel free to get in touch.</p>

  <div class="divider"></div>

  <div class="meta">
    <span class="meta-name">Gruff Drury — Designer &amp; Maker</span>
    <a class="contact-link" href="mailto:gruffdrury@icloud.com">gruffdrury@icloud.com</a>
  </div>
</div>
</body>
</html>
