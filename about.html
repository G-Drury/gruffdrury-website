<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Griff Drury</title>
<link rel="stylesheet" href="css/main.css">
<style>
body { overflow-x: hidden; }
.about-page { min-height: 100vh; padding: 100px 28px 60px; max-width: 800px; margin: 0 auto; }
.about-page-title { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: clamp(40px,6vw,72px); letter-spacing: -0.03em; text-transform: uppercase; color: var(--ink); line-height: 0.92; margin-bottom: 40px; transition: color 0.4s; }
.about-page-title .or { color: var(--orange); }
.placeholder { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 0.08em; line-height: 1.9; color: var(--muted); padding: 24px; border: 0.5px dashed var(--border); border-radius: 2px; }

/* ── cursor: force none on every element in this page ── */
html, body, *, *::before, *::after { cursor: none !important; }

/* ── custom cursor ── */
#cur {
  position: fixed; width: 8px; height: 8px; background: #fff;
  border-radius: 50%; pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%); mix-blend-mode: difference;
  transition: transform .12s cubic-bezier(.34,1.56,.64,1);
}
</style>
</head>
<body>
<div id="cur"></div>
<nav class="top-nav">
  <div class="nav-mark" onclick="window.location.href='index.html'">
    <span class="nav-g">G.</span><span class="nav-drury">Drury</span>
  </div>
  <div class="nav-center">
    <div class="theme-dial" id="theme-dial" onclick="advTheme()">
    <span class="nd-icon" id="nd-icon">&#x2600;</span>
    <svg width="34" height="34" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
      <path class="nd-arc" fill="none" d="M 4.4,11.4 A 15,15,0,0,1,17,2 A 15,15,0,0,1,29.6,11.4" stroke-width="1.2"/>
      <circle class="nd-pm" id="nd-pm0" cx="4.4"  cy="11.4" r="2"/>
      <circle class="nd-pm" id="nd-pm1" cx="17"   cy="2"    r="2"/>
      <circle class="nd-pm" id="nd-pm2" cx="29.6" cy="11.4" r="2"/>
      <g transform="translate(17,17)"><g id="nd-knob">
        <circle class="nd-body" cx="0" cy="0" r="10"/>
        <circle class="nd-ind"  cx="0" cy="-8.5" r="1.8"/>
      </g></g>
    </svg>
    <span class="nd-label" id="nd-label">Light</span>
  </div>
  </div>
  <div class="nav-right">
    <ul class="nav-links">
      <li><span onclick="window.location.href='index.html'">← Home</span></li>
      <li><span onclick="window.location.href='archive.html'">Work</span></li>
      <li><span onclick="window.location.href='contact.html'">Contact</span></li>
    </ul>
  </div>
</nav>
<div class="about-page">
  <h1 class="about-page-title">About<br><span class="or">Griff</span></h1>
  <div class="placeholder">About page — coming soon. This page will contain Griff's biography, design philosophy, CV, and process writing.</div>
</div>
<script>
/* ── cursor ── */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
document.addEventListener('mousedown', () => { cur.style.transform = 'translate(-50%,-50%) scale(0.5)'; });
document.addEventListener('mouseup',   () => { cur.style.transform = 'translate(-50%,-50%) scale(1)'; });
/* ── THEME DIAL — always clockwise ── */
(function(){
  const MODES=['Light','Dark','Fun'], ICONS=['☀','☽','★'];
  const INC=[55,55,250], DURS=[0.44,0.44,0.9];
  let st=0, ang=-55;
  const saved=localStorage.getItem('griff-theme');
  if(saved==='1'){st=1;ang=0;document.documentElement.setAttribute('data-theme','dark');}
  else if(saved==='2'){st=2;ang=55;}
  function updateUI(){
    const ic=document.getElementById('nd-icon'), lb=document.getElementById('nd-label');
    if(ic) ic.textContent=ICONS[st]; if(lb) lb.textContent=MODES[st];
    [0,1,2].forEach(j=>{
      const pm=document.getElementById('nd-pm'+j); if(!pm) return;
      if(j===st){pm.setAttribute('fill','#E85D00');pm.setAttribute('r','2.8');}
      else{pm.removeAttribute('fill');pm.setAttribute('r','2');}
    });
  }
  function syncKnob(){
    const k=document.getElementById('nd-knob'); if(!k) return;
    k.style.transition='none';
    k.style.transform=`rotate(${ang}deg)`;
    setTimeout(()=>{k.style.transition='';},60);
  }
  window.advTheme=function(){
    const prev=st; ang+=INC[prev]; st=(st+1)%3;
    const k=document.getElementById('nd-knob');
    if(k){
      k.style.transition=`transform ${DURS[prev]}s cubic-bezier(0.34,1.08,0.64,1)`;
      k.style.transform=`rotate(${ang}deg)`;
    }
    if(st===1) document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('griff-theme',st); updateUI();
  };
  syncKnob(); updateUI();
})();
</script>
</body>
</html>
