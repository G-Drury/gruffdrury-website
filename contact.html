<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <script>(function(){var t=parseInt(localStorage.getItem('griff-theme'),10)||0;if(t===1)document.documentElement.setAttribute('data-theme','dark');})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Griff Drury</title>
<link rel="stylesheet" href="css/main.css">
<style>
body { overflow-x: hidden; }
.contact-page { min-height: 100vh; padding: 100px 28px 60px; max-width: 800px; margin: 0 auto; }
.contact-page-title { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: clamp(40px,6vw,72px); letter-spacing: -0.03em; text-transform: uppercase; color: var(--ink); line-height: 0.92; margin-bottom: 40px; transition: color 0.4s; }
.contact-page-title .or { color: var(--orange); }
.placeholder { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 0.08em; line-height: 1.9; color: var(--muted); padding: 24px; border: 0.5px dashed var(--border); border-radius: 2px; }

/* ── cursor: force none on every element in this page ── */
html, body, *, *::before, *::after { cursor: none !important; }

/* ── custom cursor ── */
#cur {
  position: fixed; width: 8px; height: 8px; background: #fff;
  border-radius: 50%; pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%); mix-blend-mode: difference;
  transition: transform .12s cubic-bezier(.34,1.56,.64,1);
}
</style>
</head>
<body>
<div id="cur"></div>
<nav class="top-nav">
  <div class="nav-mark" onclick="window.location.href='index.html'">
    <span class="nav-g">G.</span><span class="nav-drury">Drury</span>
  </div>
  <div class="nav-center">
    <div class="theme-dial" id="theme-dial">
      <span class="nd-icon" id="nd-icon" onclick="advTheme()">&#x2600;</span>
      <svg width="64" height="64" viewBox="0 0 64 64"
           xmlns="http://www.w3.org/2000/svg"
           style="display:block;transform:translateY(14px);overflow:visible;">
        <path class="nd-arc" fill="none"
              d="M 5.79,13.65 A 32,32,0,0,1,32,0 A 32,32,0,0,1,58.21,13.65"
              stroke-width="1.5"/>
        <circle class="nd-pm" id="nd-pm0" cx="5.79"  cy="13.65" r="3"
                onclick="setTheme(0);event.stopPropagation();"/>
        <circle class="nd-pm" id="nd-pm1" cx="32"    cy="0"     r="3"
                onclick="setTheme(1);event.stopPropagation();"/>
        <circle class="nd-pm" id="nd-pm2" cx="58.21" cy="13.65" r="3"
                onclick="setTheme(2);event.stopPropagation();"/>
        <g transform="translate(32,32)"><g id="nd-knob" onclick="advTheme()">
          <circle class="nd-body" cx="0" cy="0" r="26"/>
          <circle cx="0" cy="-20" r="2.5" fill="#F0EBE3"/>
        </g></g>
      </svg>
      <span class="nd-label" id="nd-label" onclick="advTheme()">Light</span>
    </div>
  </div>
  <div class="nav-right">
    <ul class="nav-links">
      <li><span onclick="window.location.href='index.html'">← Home</span></li>
      <li><span onclick="window.location.href='archive.html'">Work</span></li>
      <li><span onclick="window.location.href='about.html'">About</span></li>
    </ul>
  </div>
</nav>
<div class="contact-page">
  <h1 class="contact-page-title">Get in<br><span class="or">Touch</span></h1>
  <div class="placeholder">Contact page — coming soon. This page will contain contact details, availability, and a contact form.</div>
</div>
<script>
/* ── cursor ── */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
document.addEventListener('mousedown', () => { cur.style.transform = 'translate(-50%,-50%) scale(0.5)'; });
document.addEventListener('mouseup',   () => { cur.style.transform = 'translate(-50%,-50%) scale(1)'; });
/* ── theme dial ── */
(function(){
  var MODES=['Light','Dark','Fun'];
  var ICONS=['\u2600','\u263d','\u2605'];   /* ☀ ☽ ★ */
  var INC=[55,55,250];                      /* clockwise deg per state */
  var st=0, ang=-55;

  /* apply saved theme before first paint */
  var saved=parseInt(localStorage.getItem('griff-theme'),10)||0;
  if(saved===1){st=1;ang=0;document.documentElement.setAttribute('data-theme','dark');}
  else if(saved===2){st=2;ang=55;}

  function rotate(degrees, duration){
    var k=document.getElementById('nd-knob');
    if(!k) return;
    k.style.transition = duration
      ? 'transform '+duration+'s cubic-bezier(0.34,1.08,0.64,1)'
      : 'none';
    k.style.transform = 'rotate('+ang+'deg)';
  }

  function applyTheme(){
    if(st===1) document.documentElement.setAttribute('data-theme','dark');
    else       document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('griff-theme',st);
  }

  function renderUI(){
    var ic=document.getElementById('nd-icon');
    var lb=document.getElementById('nd-label');
    if(ic) ic.textContent=ICONS[st];
    if(lb) lb.textContent=MODES[st];
    for(var j=0;j<3;j++){
      var pm=document.getElementById('nd-pm'+j);
      if(!pm) continue;
      if(j===st){ pm.setAttribute('fill','#E85D00'); pm.setAttribute('r','4'); }
      else       { pm.removeAttribute('fill');        pm.setAttribute('r','3'); }
    }
  }

  /* cycle one step clockwise */
  window.advTheme=function(){
    var prev=st;
    ang+=INC[prev]; st=(st+1)%3;
    rotate(INC[prev]===250 ? 0.9 : 0.44);
    applyTheme(); renderUI();
  };

  /* jump clockwise to a specific mode — used by arc dot clicks */
  window.setTheme=function(target){
    if(target===st) return;
    /* count clockwise steps */
    var steps=0, tmp=st;
    while(tmp!==target && steps<3){ tmp=(tmp+1)%3; steps++; }
    /* accumulate angle for each step */
    tmp=st;
    var totalDeg=0;
    for(var i=0;i<steps;i++){ totalDeg+=INC[tmp]; tmp=(tmp+1)%3; }
    ang+=totalDeg; st=target;
    /* duration scales with degrees travelled */
    var dur=Math.max(0.44, totalDeg/280*0.9);
    rotate(dur);
    applyTheme(); renderUI();
  };

  /* init: set rotation without animation */
  rotate(0);
  renderUI();
})();
</script>
</body>
</html>
